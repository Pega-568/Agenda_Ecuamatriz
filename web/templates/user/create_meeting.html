{% extends "layouts/base.html" %}

{% block page_title %}Nueva Reunión{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('web_user.create_meeting') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      
      <div class="form-group">
        <label for="title" class="form-label">Título de la Reunión</label>
        <input type="text" id="title" name="title" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Descripción / Agenda (Opcional)</label>
        <textarea id="description" name="description" class="form-control" rows="3"></textarea>
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--spacing-4);">
        <div class="form-group">
          <label for="date" class="form-label">Fecha de Inicio</label>
          <input type="date" id="date" name="date" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="start_time" class="form-label">Hora de Inicio</label>
          <input type="time" id="start_time" name="start_time" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="end_time" class="form-label">Hora de Fin</label>
          <input type="time" id="end_time" name="end_time" class="form-control" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="room_id" class="form-label">Sala de Reuniones</label>
        <select id="room_id" name="room_id" class="form-control" required>
          <option value="">-- Seleccionar Sala --</option>
          {% for room in rooms %}
          <option value="{{ room.id }}">{{ room.name }} (Capacidad: {{ room.capacity }})</option>
          {% endfor %}
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Participantes Invitados (IDs separados por coma por ahora para prototipo)</label>
        <input type="text" name="participants" class="form-control" placeholder="Ej: 2, 4, 5">
        <small class="form-text">En una versión avanzada usaríamos un componente multi-select.</small>
      </div>
      
      <div class="form-group" style="margin-top: var(--spacing-6); padding-top: var(--spacing-4); border-top: 1px solid var(--color-gray-300);">
        <button type="submit" class="btn btn-primary">Agendar Reunión</button>
        <a href="{{ url_for('web_user.dashboard') }}" class="btn btn-secondary" style="margin-left: var(--spacing-2);">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
