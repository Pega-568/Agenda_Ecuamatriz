{% extends "layouts/base.html" %}

{% block page_title %}Configuración del Sistema{% endblock %}

{% block content %}
<div class="bg-surface border border-outline-variant rounded-xl shadow-sm overflow-hidden max-w-2xl">
  <div class="p-6 border-b border-outline-variant bg-surface-container-low">
    <h3 class="font-title-large text-title-large text-on-surface">Ajustes Globales</h3>
  </div>
  <div class="p-6">
    <form method="POST" action="{{ url_for('web_admin.settings') }}" class="space-y-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      
      {% for setting in settings %}
      <div>
        <label for="{{ setting.key }}" class="block font-label-lg text-label-lg text-on-surface mb-1">{{ setting.key }}</label>
        <p class="text-body-sm text-on-surface-variant mb-2">{{ setting.description }}</p>
        <input type="text" id="{{ setting.key }}" name="{{ setting.key }}" class="w-full bg-surface-container border border-outline rounded-lg px-4 py-2 text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" value="{{ setting.value }}">
      </div>
      {% endfor %}
      
      <div class="pt-4 border-t border-outline-variant">
        <button type="submit" class="bg-primary hover:bg-primary-container text-on-primary hover:text-on-primary-container font-button-text text-button-text rounded-full px-8 py-3 transition-colors">Guardar Configuración</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
