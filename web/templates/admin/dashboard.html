{% extends "layouts/base.html" %}

{% block page_title %}Dashboard de Administrador{% endblock %}

{% block page_actions %}
<p class="font-body-md text-body-md text-on-surface-variant">Bienvenido al panel de administración de Agenda Ecuamatriz.</p>
{% endblock %}

{% block content %}
<div class="grid grid-cols-12 gap-6 mb-stack-lg">
  <!-- Usuarios -->
  <div class="col-span-12 lg:col-span-6 bg-surface-container-lowest border border-outline-variant p-6 rounded-xl flex flex-col justify-between hover:shadow-md transition-shadow">
    <div class="flex justify-between items-start">
      <div class="p-3 bg-primary-container rounded-xl">
        <span class="material-symbols-outlined text-on-primary-container">group</span>
      </div>
    </div>
    <div class="mt-4">
      <p class="text-[28px] font-black text-primary">--</p>
      <p class="font-body-md text-body-md text-on-surface-variant">Usuarios Activos</p>
    </div>
  </div>
  
  <!-- Salas -->
  <div class="col-span-12 lg:col-span-6 bg-surface-container-lowest border border-outline-variant p-6 rounded-xl flex flex-col justify-between hover:shadow-md transition-shadow">
    <div class="flex justify-between items-start">
      <div class="p-3 bg-secondary-container rounded-xl">
        <span class="material-symbols-outlined text-on-secondary-container">meeting_room</span>
      </div>
    </div>
    <div class="mt-4">
      <p class="text-[28px] font-black text-primary">--</p>
      <p class="font-body-md text-body-md text-on-surface-variant">Salas Disponibles</p>
    </div>
  </div>
</div>
{% endblock %}
