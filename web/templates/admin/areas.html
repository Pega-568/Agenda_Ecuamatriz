{% extends "layouts/base.html" %}

{% block page_title %}Gestión de Áreas{% endblock %}

{% block content %}
<div class="card" style="margin-bottom: 2rem;">
  <div class="card-body">
    <h3 style="margin-bottom: 1rem;">Nueva Área</h3>
    <form method="POST" action="{{ url_for('web_admin.areas') }}" class="form-group">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
          <label>Nombre del Área</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div>
          <label>Descripción</label>
          <input type="text" name="description" class="form-control">
        </div>
      </div>
      <div style="margin-top: 1rem;">
        <button type="submit" class="btn btn-primary">Crear Área</button>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre del Área</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody>
          {% for area in areas %}
          <tr>
            <td>{{ area.name }}</td>
            <td>{{ area.description or 'N/A' }}</td>
          </tr>
          {% else %}
          <tr>
            <td colspan="2" style="text-align: center;">No hay áreas registradas.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
