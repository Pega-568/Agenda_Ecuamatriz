{% extends "layouts/base.html" %}

{% block page_title %}Panel de Secretaría{% endblock %}

{% block page_actions %}
<p class="font-body-md text-body-md text-on-surface-variant">Bienvenida al panel de secretaría. Aquí puedes monitorear la actividad.</p>
{% endblock %}

{% block content %}
<div class="grid grid-cols-12 gap-6 mb-stack-lg">
  <!-- Reuniones Hoy -->
  <div class="col-span-12 lg:col-span-6 bg-surface-container-lowest border border-outline-variant p-6 rounded-xl flex flex-col justify-between hover:shadow-md transition-shadow">
    <div class="flex justify-between items-start">
      <div class="p-3 bg-tertiary-container rounded-xl">
        <span class="material-symbols-outlined text-on-tertiary-container">event</span>
      </div>
    </div>
    <div class="mt-4">
      <p class="text-[28px] font-black text-primary">--</p>
      <p class="font-body-md text-body-md text-on-surface-variant">Reuniones Hoy</p>
    </div>
  </div>
  
  <!-- Salas Ocupadas -->
  <div class="col-span-12 lg:col-span-6 bg-surface-container-lowest border border-outline-variant p-6 rounded-xl flex flex-col justify-between hover:shadow-md transition-shadow">
    <div class="flex justify-between items-start">
      <div class="p-3 bg-secondary-container rounded-xl">
        <span class="material-symbols-outlined text-on-secondary-container">meeting_room</span>
      </div>
    </div>
    <div class="mt-4">
      <p class="text-[28px] font-black text-primary">--</p>
      <p class="font-body-md text-body-md text-on-surface-variant">Salas Ocupadas</p>
    </div>
  </div>
</div>
{% endblock %}
