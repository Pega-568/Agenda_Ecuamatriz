[pytest]
# ============================================================
# pytest.ini — Configuración de pytest
# Agenda Ecuamatriz
# ============================================================

# Directorio raíz de tests
testpaths = tests

# Mostrar salida de print() en tests fallidos
addopts =
    -v
    --tb=short
    --strict-markers

# Marcadores personalizados
markers =
    slow: Tests que tardan más de 1 segundo
    integration: Tests de integración que requieren BD real
    unit: Tests unitarios sin BD

# Mínima versión de pytest requerida
minversion = 8.0
