version: '3.8'

services:
  web:
    build: .
    container_name: agenda_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DATABASE_URL=postgresql+psycopg://agenda_user:agenda_password@db:5432/agenda_ecuamatriz
      - SECRET_KEY=CAMBIAR_ESTO_EN_PRODUCCION_CON_UN_HASH_SEGURO
      - APP_URL=http://localhost:5000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: agenda_db
    restart: always
    environment:
      - POSTGRES_USER=agenda_user
      - POSTGRES_PASSWORD=agenda_password
      - POSTGRES_DB=agenda_ecuamatriz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_ecuamatriz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: agenda_postgres_data
